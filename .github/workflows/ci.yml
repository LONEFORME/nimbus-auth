name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace server

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare database
        run: |
          npm run db:push
          npm run db:seed

      - name: Smoke test
        run: |
          npm run start --workspace server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          bash scripts/smoke.sh

      - name: Show server log on failure
        if: failure()
        run: test -f /tmp/server.log && cat /tmp/server.log || true
